name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --extra test pytest -q

  publish:
    # Publish to PyPI when a version tag (e.g. v2026.1.0) is pushed, via trusted publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
